site_name: Aras Selahiye
site_description: Photonics and data engineer — optics, photonics, and machine learning for imaging.
site_url: https://alltairas.github.io/
repo_url: https://github.com/Alltairas/Alltairas.github.io
repo_name: Alltairas/Alltairas.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - toc.integrate
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - About: about.md
  - Projects: projects.md
  - Demos:
      - ISS Tracker: demos/iss-tracker.md
      - Movie Showtimes: demos/movies.md
      - France Temperature Map: demos/weather.md
  - Blog: blog/index.md
  - Contact: contact.md

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_css:
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
  - assets/css/terminal.css
  - assets/css/profile.css
  - assets/css/iss-tracker.css
  - assets/css/weather-map.css

extra_javascript:
  - https://unpkg.com/leaflet@1.9.4/dist/leaflet.js
  - assets/js/iss-tracker.js
  - assets/js/movies-terminal.js
  - assets/js/weather-map.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Alltairas
    - icon: fontawesome/brands/linkedin
      link: https://fr.linkedin.com/in/aras-selahiye-667079134
    - icon: fontawesome/solid/envelope
      link: mailto:aras.selahiye@hotmail.com

copyright: Copyright &copy; Aras Selahiye
